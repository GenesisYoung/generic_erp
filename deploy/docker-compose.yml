# Generic ERP - MySQL + Redis + backend (Spring Boot) + frontend (nginx).
#   cd deploy && cp .env.example .env   # then fill in the secrets
#   docker compose up -d --build
# The browser only talks to the frontend container; nginx forwards /api and /ws
# to the backend, so the page and the API share one origin (no CORS).
name: generic-erp

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-generic_erp}
      MYSQL_USER: ${MYSQL_USER:-erp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - db-data:/var/lib/mysql
      # Runs once, only when db-data is empty.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Only on this machine, for admin tools. Remove the line to hide MySQL completely.
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  backend:
    build:
      context: ..
    image: generic-erp-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-generic_erp}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=${TZ:-Asia/Shanghai}&characterEncoding=utf8
      DB_USERNAME: ${MYSQL_USER:-erp}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AUTHENTICATION_SECRET_KEY_ACCESS: ${AUTHENTICATION_SECRET_KEY_ACCESS:?set AUTHENTICATION_SECRET_KEY_ACCESS in .env}
      AUTHENTICATION_SECRET_KEY_REFRESH: ${AUTHENTICATION_SECRET_KEY_REFRESH:?set AUTHENTICATION_SECRET_KEY_REFRESH in .env}
      ACCESS_TIMEOUT: ${ACCESS_TIMEOUT:-900000}
      REFRESH_TIMEOUT: ${REFRESH_TIMEOUT:-604800000}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-http://localhost:8088}
      ERP_DEFAULT_LOCALE: ${ERP_DEFAULT_LOCALE:-zh-CN}
      ERP_PURCHASE_ZONE: ${TZ:-Asia/Shanghai}
      ERP_EXCEPTION_NOTIFY_DEPT_IDS: ${ERP_EXCEPTION_NOTIFY_DEPT_IDS:-}
      ERP_EXCEPTION_APPROVER_DEPT_NAMES: ${ERP_EXCEPTION_APPROVER_DEPT_NAMES:-PMC}
      # Old ERP (SQL Server), read-only and outside Docker.
      LEGACY_ERP_ENABLED: ${LEGACY_ERP_ENABLED:-false}
      LEGACY_ERP_DB_URL: ${LEGACY_ERP_DB_URL:-}
      LEGACY_ERP_DB_USERNAME: ${LEGACY_ERP_DB_USERNAME:-}
      LEGACY_ERP_DB_PASSWORD: ${LEGACY_ERP_DB_PASSWORD:-}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75}
    volumes:
      - backend-files:/data/files
      - backend-logs:/app/logs
    # Lets LEGACY_ERP_DB_URL point at host.docker.internal when SQL Server runs on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8080"

  frontend:
    build:
      context: ${FRONTEND_DIR:-../../generic-front/app}
    image: generic-erp-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      BACKEND_UPSTREAM: backend:8080
    ports:
      - "${HTTP_PORT:-8088}:80"

volumes:
  db-data:
  redis-data:
  backend-files:
  backend-logs:
