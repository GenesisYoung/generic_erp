spring:
  messages:
    # User-facing texts: i18n/messages.properties (English) and messages_zh_CN.properties.
    # Code reads them through configuration.i18n.I18n; this block only lets Spring use the same files.
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: true
    always-use-message-format: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  cache:
    type: redis
    redis:
      time-to-live: 300000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: 1
      timeout: 3s
      # Lettuce connection pool configuration
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  application:
    name: generic_erp
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER_CLASS_NAME}
  global:
    file:
      home_path: ${FILE_PATH}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
        "[use_sql_comments]": true
        "[dialect]": org.hibernate.dialect.MySQLDialect

security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  login:
    max-failed-attempts: ${LOGIN_MAX_FAILED_ATTEMPTS:3}
    lock-duration-ms: ${LOGIN_LOCK_DURATION_MS:900000}
  token:
    cookie:
      secure: ${AUTH_COOKIE_SECURE:true}
    secret:
      access: ${AUTHENTICATION_SECRET_KEY_ACCESS}
      refresh: ${AUTHENTICATION_SECRET_KEY_REFRESH}
    expiracy:
      access: ${ACCESS_TIMEOUT}
      refresh: ${REFRESH_TIMEOUT}

logging:
  file:
    name: generic_erp.log
  level:
    "[org.hibernate.SQL]": DEBUG
    "[org.hibernate.type.descriptor.sql.BasicBinder]": TRACE
    web: DEBUG
    "[org.hibernate]": error

erp:
  i18n:
    # Language used when the frontend sends no Accept-Language header (zh-CN or en-US).
    default-locale: ${ERP_DEFAULT_LOCALE:zh-CN}
  purchase:
    # Business time zone: follow-up windows are calendar dates in this zone.
    zone: ${ERP_PURCHASE_ZONE:Asia/Shanghai}
    followup:
      # Hourly job: marks missed follow-ups, adds daily OVERDUE windows and sends due reminders.
      enabled: ${ERP_FOLLOWUP_JOB_ENABLED:true}
      cron: "0 0 * * * *"
    placement:
      # 采购下单任务: purchase orders must be placed within deadline-days.
      # Runs every 15 minutes: creates tasks, closes tasks with a linked PO (or, with trigger
      # CONFIRMATION, when the old ERP confirms the document), and sends one reminder
      # remind-hours before the deadline and one overdue alert.
      enabled: ${ERP_PLACEMENT_JOB_ENABLED:true}
      cron: ${ERP_PLACEMENT_CRON:0 */15 * * * *}
      deadline-days: 2
      remind-hours: 12
      # CONFIRMATION: one task per purchase application (sample orders) or purchase plan
      # (production orders) that has no purchase order yet, from erp.legacy.placement-source.
      # Falls back to ORDER_AUDIT while neither query is set or the old ERP is off.
      # ORDER_AUDIT: one task per PMC order review PASS (the behaviour before 2026-11-25).
      trigger: ${ERP_PLACEMENT_TRIGGER:CONFIRMATION}
    quotation:
      # 报价方案: a BOM line counts as packaging when its material class (PRODUCT.CLAS) starts with one
      # of these (3xx = packaging in PRODCLAS, checked 2026-11-24), unless it comes from a packaging BOM.
      packaging-class-prefixes: ${ERP_QUOTATION_PACKAGING_CLASSES:3}
      # Price check, same rule as the purchasing BOM sheets: OK when 0.8 < price / last PO price < 1.2.
      price-check-low: 0.8
      price-check-high: 1.2
      # List purchase plans that are partly bought too (true), or only plans with nothing bought (false).
      include-partly-bought: ${ERP_QUOTATION_INCLUDE_PARTLY_BOUGHT:true}
    exception:
      # 采购异常: who is alerted when an exception is reported or changes status
      # (besides the reporter, the order's purchaser and the handler).
      notify-roles: ${ERP_EXCEPTION_NOTIFY_ROLES:purchaser,pmc}
      # Planning and Operations department ids (department_tb.id), comma separated.
      notify-dept-ids: ${ERP_EXCEPTION_NOTIFY_DEPT_IDS:}
      # PMC approval: a resolution only counts once a member of the PMC department approves it.
      # The department is found by name (any department whose name contains one of these,
      # ignoring case; sub-departments included) and/or by id (department_tb.id), comma separated.
      approver-dept-names: ${ERP_EXCEPTION_APPROVER_DEPT_NAMES:PMC}
      approver-dept-ids: ${ERP_EXCEPTION_APPROVER_DEPT_IDS:}
  legacy:
    # Read-only sync of purchase orders and customer orders from the old ERP (SQL Server).
    # Off by default. Set LEGACY_ERP_ENABLED=true and the LEGACY_ERP_DB_* variables
    # (use a SELECT-only database login) to turn it on.
    enabled: ${LEGACY_ERP_ENABLED:false}
    source-system: LEGACY_ERP
    datasource:
      url: ${LEGACY_ERP_DB_URL}
      username: ${LEGACY_ERP_DB_USERNAME}
      password: ${LEGACY_ERP_DB_PASSWORD}
    purchase-order:
      sync-cron: ${LEGACY_ERP_PO_SYNC_CRON:0 */15 * * * *}
      initial-lookback-days: 60
      batch-limit: 5000
      # Old ERP (高格 VEPRO) purchase orders: ORDSPHS1 header + ORDSPHS2 lines.
      # Source and assumptions: Implementation Doc/Purchase Follow-Up Module/legacy_po_sync_query.sql
      # Override with the environment variable ERP_LEGACY_PURCHASEORDER_QUERY if needed (Spring maps it
      # to erp.legacy.purchase-order.query). Must return the aliases the reader expects.
      query: |
        SELECT
            RTRIM(h.CODE)                                         AS po_no,
            RTRIM(h.SUPP)                                         AS supplier_code,
            RTRIM(s.CNAME)                                        AS supplier_name,
            RTRIM(h.STAFF)                                        AS buyer_code,
            h.SDATE                                               AS order_date,
            h.DLVDATE                                             AS expected_date,
            CASE
                WHEN h.CLOSETYPE <> 0                              THEN 'CLOSED'
                WHEN l.qty > 0 AND l.recqty >= l.qty               THEN 'RECEIVED'
                WHEN l.recqty > 0                                  THEN 'PARTIALLY_RECEIVED'
                ELSE 'PLACED'
            END                                                   AS status,
            COALESCE(h.UPDATETIME, h.SCRDATE, h.INDATETIME, h.SDATE) AS updated_at
        FROM ORDSPHS1 h WITH (NOLOCK)
        LEFT JOIN (
            SELECT MASTERI, SUM(QTY) AS qty, SUM(RECQTY) AS recqty
            FROM ORDSPHS2 WITH (NOLOCK)
            GROUP BY MASTERI
        ) l ON l.MASTERI = h.ERI
        LEFT JOIN SUPPLIER s WITH (NOLOCK) ON s.CODE = h.SUPP
        WHERE ISNULL(h.SCRUTINY, '') <> ''
          AND h.CODE IS NOT NULL
          AND h.SDATE IS NOT NULL
          AND (
                COALESCE(h.UPDATETIME, h.SCRDATE, h.INDATETIME, h.SDATE) > :since
             OR (h.CLOSETYPE = 0 AND h.SDATE >= DATEADD(day, -120, GETDATE()))
          )
        ORDER BY COALESCE(h.UPDATETIME, h.SCRDATE, h.INDATETIME, h.SDATE), h.CODE
      # Lines of the orders read above (named list parameter :poNos). plan_type decides which
      # follow-up task a line belongs to: plan types are put into plan groups on the follow-up
      # template page, and a "separate" group gets its own task. Source and assumptions:
      # Implementation Doc/Follow-Up Plan Groups/legacy_po_line_query.sql
      # plan_type below = the material class one level up (PRODCLAS.UPPERCLAS; PRODUCT.BCLAS is
      # empty in the old ERP). Change only the two plan_type
      # columns to group by another field. Set ERP_LEGACY_PURCHASEORDER_LINEQUERY to an empty value
      # to stop syncing lines (every order then keeps one follow-up task).
      line-query: |
        SELECT
            RTRIM(h.CODE)                                         AS po_no,
            l.SERIAL                                              AS line_no,
            RTRIM(l.PROD)                                         AS material_code,
            RTRIM(pr.CNAME)                                       AS material_name,
            COALESCE(NULLIF(RTRIM(c.UPPERCLAS), ''), RTRIM(pr.CLAS)) AS plan_type,
            COALESCE(RTRIM(u.NAME), RTRIM(c.NAME))                AS plan_type_name,
            l.QTY                                                 AS qty,
            l.RECQTY                                              AS received_qty
        FROM ORDSPHS1 h WITH (NOLOCK)
        JOIN ORDSPHS2 l WITH (NOLOCK) ON l.MASTERI = h.ERI
        LEFT JOIN PRODUCT pr WITH (NOLOCK) ON pr.CODE = l.PROD
        LEFT JOIN PRODCLAS c WITH (NOLOCK) ON c.CODE = pr.CLAS
        LEFT JOIN PRODCLAS u WITH (NOLOCK) ON u.CODE = c.UPPERCLAS
        WHERE h.CODE IN (:poNos)
        ORDER BY h.CODE, l.SERIAL
      # Raw old-ERP status -> PLACED / PARTIALLY_RECEIVED / RECEIVED / CLOSED / CANCELLED.
      # The default query already returns these names, so no mapping is needed.
      # A status that is neither mapped nor one of these names counts as PLACED.
      status-map: {}
    placement-source:
      # Documents that decide purchase placement tasks (trigger CONFIRMATION). Each query returns
      # documents dated on or after :since with the aliases order_no, source_no, source_date,
      # confirmed (0/1), note, first_po_no. Rows are merged per (source_no, order_no); the document
      # counts as confirmed only when all its rows are. Blank = that section is off.
      # The old ERP has no "confirmed" flag (checked 2026-11-25: 审核/SCRUTINY is empty on documents
      # that already have POs). "Confirmed" = the document has its first PO, or it was closed.
      # Source and checks: Implementation Doc/Placement Sources/legacy_placement_source_query.sql
      # Sample orders: purchase applications (ORDREQ1/2). PO line ORDSPHS2.SRCERI = ORDREQ2.ERI;
      # those POs are numbered YP... ORDREQ2.PHSQTY > 0 exactly when a line has a PO (135/135).
      # Only applications whose memo contains 样品 (e.g. "26256样品单 …") count as sample orders;
      # others ("调试用", "订单26338 …") are skipped (decided 2026-11-25).
      sample-query: |
        SELECT
            RTRIM(h.CODE)                                         AS order_no,
            RTRIM(h.CODE)                                         AS source_no,
            h.SDATE                                               AS source_date,
            LEFT(RTRIM(h.MEMO), 200)                              AS note,
            po.first_po_no                                        AS first_po_no,
            CASE WHEN po.first_po_no IS NOT NULL OR h.CLOSETYPE <> 0 THEN 1 ELSE 0 END AS confirmed
        FROM ORDREQ1 h WITH (NOLOCK)
        OUTER APPLY (
            SELECT TOP 1 RTRIM(p1.CODE) AS first_po_no
            FROM ORDREQ2 l WITH (NOLOCK)
            JOIN ORDSPHS2 p  WITH (NOLOCK) ON p.SRCERI = l.ERI
            JOIN ORDSPHS1 p1 WITH (NOLOCK) ON p1.ERI = p.MASTERI
            WHERE l.MASTERI = h.ERI
            ORDER BY p1.SDATE, p1.CODE
        ) po
        WHERE h.SDATE >= :since
          AND h.CODE IS NOT NULL
          AND h.MEMO LIKE N'%样品%'
      # Production orders: purchase plans (PLANORDER1/2). PLANORDER1.CODE is the customer order no.
      # (26394-W53); PO line ORDSPHS2.PLANERI = PLANORDER2.ERI; those POs are numbered P...
      production-query: |
        SELECT
            RTRIM(h.CODE)                                         AS order_no,
            RTRIM(h.CODE)                                         AS source_no,
            h.SDATE                                               AS source_date,
            LEFT(RTRIM(h.MEMO), 200)                              AS note,
            po.first_po_no                                        AS first_po_no,
            CASE WHEN po.first_po_no IS NOT NULL OR h.CLOSETYPE <> 0 THEN 1 ELSE 0 END AS confirmed
        FROM PLANORDER1 h WITH (NOLOCK)
        OUTER APPLY (
            SELECT TOP 1 RTRIM(p1.CODE) AS first_po_no
            FROM PLANORDER2 l WITH (NOLOCK)
            JOIN ORDSPHS2 p  WITH (NOLOCK) ON p.PLANERI = l.ERI
            JOIN ORDSPHS1 p1 WITH (NOLOCK) ON p1.ERI = p.MASTERI
            WHERE l.MASTERI = h.ERI
            ORDER BY p1.SDATE, p1.CODE
        ) po
        WHERE h.SDATE >= :since
          AND h.CODE IS NOT NULL
      lookback-days: 30
      batch-limit: 20000
    quotation:
      # 报价方案: orders that can be quoted, their order BOMs and purchase strategy prices.
      # Checked 2026-11-26 (legacy_quotation_bom_price_check.sql, round 1):
      #  - one order BOM per customer order line: ORDBOM1.CODE = ORDCORD2.BOMCODE (1,302/1,306)
      #    and ORDBOM1.SRCERI = ORDCORD2.ERI (1,303/1,306);
      #  - ORDBOM1.TYPE is 1 on every BOM, so it does NOT tell product and packaging apart;
      #  - the packaging BOM is ORDBOM3 (ORDBOM3.CODE = ORDCORD2.BOMCODE, round 2 Q1);
      #  - purchase strategy PHSSPROMOT2.PRICE includes tax, PRC = PRICE / (1 + TAXRATE%) when
      #    TAXRATE > 0; the supplier is often only on the header PHSSPROMOT1.CODE.
      # Blank any of the three queries to switch the quotation pages off.
      lookback-days: ${ERP_QUOTATION_LOOKBACK_DAYS:90}
      batch-limit: 5000
      # One row per customer order line of an OPEN purchase plan (PLANORDER1) dated on or after
      # :since that is not fully bought: plan_lines = its lines, plan_lines_bought = lines with a
      # purchase order line (ORDSPHS2.PLANERI = PLANORDER2.ERI). Partly bought plans are listed
      # (decided 2026-11-26; see erp.purchase.quotation.include-partly-bought).
      # Plan line -> order line: PLANORDER2.FROMORDERI = ORDCORD2.ERI (checked 2026-11-20).
      order-query: |
        SELECT
            RTRIM(co.CODE)                                        AS order_no,
            RTRIM(co.CUST)                                        AS customer_code,
            RTRIM(c.CNAME)                                        AS customer_name,
            co.SDATE                                              AS order_date,
            co.DLVDATE                                            AS delivery_date,
            RTRIM(h.CODE)                                         AS plan_no,
            h.SDATE                                               AS plan_date,
            RTRIM(cl.ERI)                                         AS line_id,
            RTRIM(cl.PROD)                                        AS product_code,
            RTRIM(pr.CNAME)                                       AS product_name,
            RTRIM(cl.SPEC)                                        AS spec,
            cl.QTY                                                AS qty,
            RTRIM(cl.UNIT)                                        AS unit,
            pb.bom_code                                           AS product_bom_code,
            kb.bom_code                                           AS packaging_bom_code,
            pc.plan_lines                                         AS plan_lines,
            pc.plan_lines_bought                                  AS plan_lines_bought
        FROM (
            SELECT DISTINCT MASTERI, FROMORDERI FROM PLANORDER2 WITH (NOLOCK)
            WHERE ISNULL(FROMORDERI, '') <> ''
        ) pl
        JOIN PLANORDER1 h  WITH (NOLOCK) ON h.ERI = pl.MASTERI
        JOIN ORDCORD2   cl WITH (NOLOCK) ON cl.ERI = pl.FROMORDERI
        JOIN ORDCORD1   co WITH (NOLOCK) ON co.ERI = cl.MASTERI
        LEFT JOIN CUSTOMER c  WITH (NOLOCK) ON c.CODE = co.CUST
        LEFT JOIN PRODUCT  pr WITH (NOLOCK) ON pr.CODE = cl.PROD
        OUTER APPLY (
            SELECT TOP 1 RTRIM(b.CODE) AS bom_code FROM ORDBOM1 b WITH (NOLOCK)
            WHERE b.SRCERI = cl.ERI OR (ISNULL(cl.BOMCODE, '') <> '' AND b.CODE = cl.BOMCODE)
            ORDER BY b.SDATE DESC
        ) pb
        OUTER APPLY (
            SELECT TOP 1 RTRIM(o3.CODE) AS bom_code FROM ORDBOM3 o3 WITH (NOLOCK)
            WHERE ISNULL(cl.BOMCODE, '') <> '' AND o3.CODE = cl.BOMCODE
        ) kb
        OUTER APPLY (
            -- has_po is worked out first; only that plain column is summed (SQL Server error 130).
            SELECT COUNT(*) AS plan_lines, SUM(f.has_po) AS plan_lines_bought
            FROM (
                SELECT CASE WHEN EXISTS (SELECT 1 FROM ORDSPHS2 p WITH (NOLOCK) WHERE p.PLANERI = l2.ERI)
                            THEN 1 ELSE 0 END AS has_po
                FROM PLANORDER2 l2 WITH (NOLOCK)
                WHERE l2.MASTERI = h.ERI
            ) f
        ) pc
        WHERE h.SDATE >= :since
          AND h.CLOSETYPE = 0
          AND co.CLOSETYPE = 0
          AND pc.plan_lines_bought < pc.plan_lines
      # Lines of both order BOMs of each line of :orderNo (checked 2026-11-26, round 2):
      #  - PRODUCT  = ORDBOM2, lines of ORDBOM1 (ORDBOM1.CODE = ORDCORD2.BOMCODE or SRCERI = line ERI);
      #  - PACKAGING = ORDBOM3, ORDBOM3.CODE = ORDCORD2.BOMCODE (1,191 of 1,191 lines with
      #    HASPKBOM = 1; PKPRODBOM matches none). Rows: product -> 7xx 包装BOM -> materials.
      # qty_per_unit = QTY, the usage (BOMQTY is 0 or 1 and is NOT the usage: a line with
      # BOMQTY 1 has QTY 300). The application multiplies it up the tree (line_key = ERI,
      # parent_key = PERI). Whether QTY is per ONE parent or already per finished product is
      # checked by legacy_quotation_check_round3.sql (R3_1, R3_2); if it is per finished product,
      # return NULL as parent_key. Keys are prefixed with P/K so the two tables never mix.
      # leaf = 0 for a line that has sub-lines or is virtual: only bought parts are priced.
      # base_price = the material's last purchase order price excl. tax (ORDSPHS2.PRICE; PRICETAX
      # is the tax-included one), for the 0.8-1.2 price check.
      bom-line-query: |
        SELECT
            bl.bom_kind                                           AS bom_kind,
            RTRIM(bl.bom_code)                                    AS bom_code,
            RTRIM(bl.line_eri)                                    AS line_id,
            RTRIM(bl.product_code)                                AS product_code,
            bl.order_qty                                          AS order_qty,
            bl.line_no                                            AS line_no,
            bl.bom_level                                          AS bom_level,
            RTRIM(bl.material_code)                               AS material_code,
            RTRIM(pr.CNAME)                                       AS material_name,
            COALESCE(NULLIF(RTRIM(bl.spec), ''), RTRIM(pr.SPEC))  AS spec,
            RTRIM(pr.UNIT)                                        AS unit,
            RTRIM(pr.CLAS)                                        AS material_class,
            bl.qty_per_unit                                       AS qty_per_unit,
            bl.leaf                                               AS leaf,
            lp.price                                              AS base_price,
            bl.line_key                                           AS line_key,
            bl.parent_key                                         AS parent_key
        FROM (
            SELECT CAST('PRODUCT' AS varchar(10)) AS bom_kind, 1 AS kind_order, pb.CODE AS bom_code,
                   cl.ERI AS line_eri, cl.PROD AS product_code, cl.QTY AS order_qty, cl.SERIAL AS line_serial,
                   l.SERIAL AS line_no, l.LVL AS bom_level, l.SUBPROD AS material_code, l.SPEC AS spec,
                   l.QTY AS qty_per_unit,
                   CASE WHEN l.VIRTUAL = 1 OR EXISTS (
                            SELECT 1 FROM ORDBOM2 ch WITH (NOLOCK)
                            WHERE ch.MASTERI = l.MASTERI AND ch.PERI = l.ERI)
                        THEN 0 ELSE 1 END AS leaf,
                   'P' + RTRIM(l.ERI) AS line_key,
                   CASE WHEN ISNULL(RTRIM(l.PERI), '') = '' THEN NULL ELSE 'P' + RTRIM(l.PERI) END AS parent_key
            FROM ORDCORD1 co WITH (NOLOCK)
            JOIN ORDCORD2 cl WITH (NOLOCK) ON cl.MASTERI = co.ERI
            CROSS APPLY (
                SELECT TOP 1 b1.ERI, b1.CODE FROM ORDBOM1 b1 WITH (NOLOCK)
                WHERE b1.SRCERI = cl.ERI OR (ISNULL(cl.BOMCODE, '') <> '' AND b1.CODE = cl.BOMCODE)
                ORDER BY b1.SDATE DESC, b1.ERI DESC
            ) pb
            JOIN ORDBOM2 l WITH (NOLOCK) ON l.MASTERI = pb.ERI
            WHERE co.CODE = :orderNo
            UNION ALL
            SELECT CAST('PACKAGING' AS varchar(10)), 2, l.CODE,
                   cl.ERI, cl.PROD, cl.QTY, cl.SERIAL,
                   l.SERIAL, l.LVL, l.SUBPROD, l.SPEC,
                   l.QTY,
                   CASE WHEN l.VIRTUAL = 1 OR EXISTS (
                            SELECT 1 FROM ORDBOM3 ch WITH (NOLOCK)
                            WHERE ch.CODE = l.CODE AND ch.PERI = l.ERI)
                        THEN 0 ELSE 1 END,
                   'K' + RTRIM(l.ERI),
                   CASE WHEN ISNULL(RTRIM(l.PERI), '') = '' THEN NULL ELSE 'K' + RTRIM(l.PERI) END
            FROM ORDCORD1 co WITH (NOLOCK)
            JOIN ORDCORD2 cl WITH (NOLOCK) ON cl.MASTERI = co.ERI
            JOIN ORDBOM3 l WITH (NOLOCK) ON l.CODE = cl.BOMCODE
            WHERE co.CODE = :orderNo
              AND ISNULL(cl.BOMCODE, '') <> ''
        ) bl
        LEFT JOIN PRODUCT pr WITH (NOLOCK) ON pr.CODE = bl.material_code
        OUTER APPLY (
            SELECT TOP 1 o.PRICE AS price
            FROM ORDSPHS2 o WITH (NOLOCK)
            JOIN ORDSPHS1 oh WITH (NOLOCK) ON oh.ERI = o.MASTERI
            WHERE o.PROD = bl.material_code AND o.PRICE > 0
            ORDER BY oh.SDATE DESC
        ) lp
        ORDER BY bl.line_serial, bl.kind_order, bl.line_no
      # Purchase strategy (采购策略) prices: PHSSPROMOT1 header / PHSSPROMOT2 lines, valid today,
      # newest line per material and supplier. Price compared = price EXCLUDING tax: PRC when
      # TAXRATE > 0, else PRICE (suppliers with 13% and 0% VAT become comparable, and it matches
      # the last PO price ORDSPHS2.PRICE). Supplier = line SUPP, or the header CODE when empty.
      price-query: |
        SELECT material_code, supplier_code, supplier_name, price, tax_rate, currency, valid_from, valid_to
        FROM (
            SELECT
                RTRIM(l.PROD)                                     AS material_code,
                sp.supplier_code                                  AS supplier_code,
                COALESCE(RTRIM(s.CNAME), RTRIM(h.NAME))           AS supplier_name,
                CASE WHEN l.TAXRATE > 0 AND l.PRC > 0 THEN l.PRC ELSE l.PRICE END AS price,
                l.TAXRATE                                         AS tax_rate,
                RTRIM(l.CURR)                                     AS currency,
                COALESCE(l.BGNDATE, h.BGNDATE)                    AS valid_from,
                COALESCE(l.ENDDATE, h.ENDDATE)                    AS valid_to,
                ROW_NUMBER() OVER (PARTITION BY l.PROD, sp.supplier_code
                                   ORDER BY COALESCE(l.BGNDATE, h.BGNDATE, l.SDATE) DESC, l.SDATE DESC) AS rn
            FROM PHSSPROMOT2 l WITH (NOLOCK)
            LEFT JOIN PHSSPROMOT1 h WITH (NOLOCK) ON h.ERI = l.MASTERI
            CROSS APPLY (
                SELECT COALESCE(NULLIF(RTRIM(l.SUPP), ''), RTRIM(h.CODE)) AS supplier_code
            ) sp
            LEFT JOIN SUPPLIER    s WITH (NOLOCK) ON s.CODE = sp.supplier_code
            WHERE l.PROD IN (:materialCodes)
              AND l.PRICE > 0
              AND sp.supplier_code IS NOT NULL
              AND (COALESCE(l.BGNDATE, h.BGNDATE) IS NULL OR COALESCE(l.BGNDATE, h.BGNDATE) <= GETDATE())
              AND (h.NOLIMIT = 1
                   OR COALESCE(l.ENDDATE, h.ENDDATE) IS NULL
                   OR COALESCE(l.ENDDATE, h.ENDDATE) >= CAST(GETDATE() AS date))
        ) x
        WHERE x.rn = 1
    customer-order:
      # New customer orders (ORDCORD1) -> PMC notification + 待评审客户订单 page.
      # Source and assumptions: Implementation Doc/Customer Order Sync/legacy_customer_order_query.sql
      # Override the query with ERP_LEGACY_CUSTOMERORDER_QUERY if needed (same aliases required).
      sync-cron: ${LEGACY_ERP_CO_SYNC_CRON:0 */15 * * * *}
      lookback-days: 60
      batch-limit: 2000
      notify-roles: pmc
      query: |
        SELECT
            RTRIM(h.ERI)                                          AS legacy_id,
            RTRIM(h.CODE)                                         AS order_no,
            RTRIM(h.CUST)                                         AS customer_code,
            RTRIM(c.CNAME)                                        AS customer_name,
            h.SDATE                                               AS order_date,
            h.DLVDATE                                             AS delivery_date,
            RTRIM(h.STAFF)                                        AS sales_code,
            l.line_count                                          AS line_count,
            h.QTY                                                 AS total_qty,
            CASE WHEN ISNULL(h.SCRUTINY, '') <> '' THEN 1 ELSE 0 END AS legacy_audited,
            CASE WHEN h.CLOSETYPE <> 0 THEN 1 ELSE 0 END          AS closed
        FROM ORDCORD1 h WITH (NOLOCK)
        LEFT JOIN (
            SELECT MASTERI, COUNT(*) AS line_count
            FROM ORDCORD2 WITH (NOLOCK)
            GROUP BY MASTERI
        ) l ON l.MASTERI = h.ERI
        LEFT JOIN CUSTOMER c WITH (NOLOCK) ON c.CODE = h.CUST
        WHERE h.SDATE >= :since
          AND h.CODE IS NOT NULL
        ORDER BY h.SDATE, h.CODE
      # PO -> customer order links, used to close placement tasks (采购下单任务).
      # Chain found by the round 2/3 checks (2026-11-20): PO line ORDSPHS2.PLANERI -> plan line
      # PLANORDER2.ERI, PLANORDER2.FROMORDERI -> customer order line ORDCORD2.ERI,
      # ORDCORD2.MASTERI -> customer order ORDCORD1.ERI. About 85% of PO lines reach a customer order.
      po-link-lookback-days: 60
      po-link-batch-limit: 20000
      po-link-query: |
        SELECT
            RTRIM(co.ERI)  AS customer_order_id,
            RTRIM(co.CODE) AS customer_order_no,
            RTRIM(cl.ERI)  AS customer_line_id,
            RTRIM(h.CODE)  AS po_no,
            MIN(h.SDATE)   AS po_date
        FROM ORDSPHS2 p WITH (NOLOCK)
        JOIN ORDSPHS1   h  WITH (NOLOCK) ON h.ERI  = p.MASTERI
        JOIN PLANORDER2 pl WITH (NOLOCK) ON pl.ERI = p.PLANERI
        JOIN ORDCORD2   cl WITH (NOLOCK) ON cl.ERI = pl.FROMORDERI
        JOIN ORDCORD1   co WITH (NOLOCK) ON co.ERI = cl.MASTERI
        WHERE h.SDATE >= :since
          AND h.CODE IS NOT NULL
          AND co.CODE IS NOT NULL
        GROUP BY co.ERI, co.CODE, cl.ERI, h.CODE
        ORDER BY MIN(h.SDATE), h.CODE
