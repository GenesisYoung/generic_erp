spring:
  cache:
    type: redis
    redis:
      time-to-live: 300000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: 1
      timeout: 3s
      # Lettuce connection pool configuration
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  application:
    name: generic_erp
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER_CLASS_NAME}
  global:
    variable:
      default-language: ${LANGUAGE}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
        "[use_sql_comments]": true
        "[dialect]": org.hibernate.dialect.MySQLDialect

security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  login:
    max-failed-attempts: ${LOGIN_MAX_FAILED_ATTEMPTS:3}
    lock-duration-ms: ${LOGIN_LOCK_DURATION_MS:900000}
  token:
    cookie:
      secure: ${AUTH_COOKIE_SECURE:true}
    secret:
      access: ${AUTHENTICATION_SECRET_KEY_ACCESS}
      refresh: ${AUTHENTICATION_SECRET_KEY_REFRESH}
    expiracy:
      access: ${ACCESS_TIMEOUT}
      refresh: ${REFRESH_TIMEOUT}

logging:
  file:
    name: generic_erp.log
  level:
    "[org.hibernate.SQL]": DEBUG
    "[org.hibernate.type.descriptor.sql.BasicBinder]": TRACE
    web: DEBUG
    "[org.hibernate]": error
app:
  language: ${LANGUAGE}
test-mode: ${TEST_MODE}
